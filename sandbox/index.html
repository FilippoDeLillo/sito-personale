<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionale — Demo interattiva | Filippo De Lillo</title>
<meta name="description" content="Demo interattiva di un gestionale: dashboard, clienti, fatture e magazzino. Tutti i dati restano nel tuo browser.">
<meta name="robots" content="noindex, follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a href="../index.html#portfolio" class="back-link" aria-label="Torna al sito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg>
        filippodelillo.it
      </a>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">G</span>
        <div>
          <div class="brand-name">Gestionale</div>
          <div class="brand-sub">Demo interattiva</div>
        </div>
      </div>
    </div>

    <nav class="nav-views" aria-label="Sezioni gestionale">
      <button class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="clienti">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><circle cx="17.5" cy="8.5" r="2.6"/><path d="M15.8 13.9c2.9.4 5.2 2.7 5.2 6.1"/></svg>
        Clienti
      </button>
      <button class="nav-item" data-view="fatture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h9l3.5 3.5V21a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1Z"/><path d="M15 2.5V6a1 1 0 0 0 1 1h3.5"/><path d="M8 12h8M8 15.5h8M8 8.5h4"/></svg>
        Fatture
      </button>
      <button class="nav-item" data-view="magazzino">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/><path d="M3 8.5V17l9 4.5 9-4.5V8.5"/><path d="M12 13v8.5"/></svg>
        Magazzino
      </button>
    </nav>

    <div class="sidebar-bottom">
      <button id="theme-toggle" class="icon-btn" aria-label="Cambia tema chiaro/scuro">
        <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.4M12 19.6V22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2 12h2.4M19.6 12H22M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
        <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
        <span>Tema</span>
      </button>
      <button id="reset-data" class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 2.6 6.35"/><path d="M3 21v-6h6"/></svg>
        <span>Reset dati demo</span>
      </button>
      <p class="privacy-note">I dati restano solo nel tuo browser: nessun server, nessun account, nessun costo per nessuno. <a href="../index.html#contatti">Vuoi uno cosi per la tua attivit&agrave;?</a></p>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-col">
    <header class="topbar">
      <button class="menu-toggle" id="mobile-menu-toggle" aria-label="Apri menu sezioni"><span></span></button>
      <div class="topbar-title">
        <h1 id="view-title">Dashboard</h1>
        <p id="view-sub">Panoramica generale dell'attivit&agrave;</p>
      </div>
      <button class="btn-primary" id="topbar-action">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span id="topbar-action-label">Nuovo cliente</span>
      </button>
    </header>

    <main id="view-container" class="view-container"></main>
  </div>
</div>

<div class="mobile-nav-scrim" id="mobile-scrim"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" id="modal">
    <div class="modal-head">
      <h2 id="modal-title">Titolo</h2>
      <button class="icon-btn-plain" id="modal-close" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <form id="modal-form" class="modal-form"></form>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
